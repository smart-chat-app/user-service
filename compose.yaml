services:
  users-service:
    build: .
    image: users-service:local
    container_name: users-service
    ports:
      - "8090:8090"             # host:container
    environment:
      SERVER_PORT: 8090
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/usersdb
      ISSUER_URI: http://keycloak:8080/realms/chat-local
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8088/realms/chat-local/protocol/openid-connect/certs
      SPRING_APPLICATION_NAME: users-service
      SPRING_MAIN_WEB-APPLICATION-TYPE: servlet
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:8090/users/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  mongo:
    image: mongo:7
    container_name: users-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -lc '</dev/tcp/localhost/27017' && echo ok || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: users-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8085:8081"
    depends_on:
      mongo:
        condition: service_healthy

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2182
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2182

      # Two listeners: INTERNAL for containers, EXTERNAL for your host/GUI
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9094:9094"     # host -> EXTERNAL listener




volumes:
  mongo_data:
