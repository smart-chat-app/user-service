name: CI-CD Workflow

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        type: choice
        required: true
        options:
          - staging
          - production
      image_tag:
        description: "Image tag to deploy (default: commit SHA)"
        type: string
        required: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B verify

  docker:
    name: Build & Push Docker image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.out.outputs.image }}
      tag: ${{ steps.out.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            echo "TAG=${{ inputs.image_tag }}" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image ref
        id: out
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT
          echo "tag=${{ env.TAG }}" >> $GITHUB_OUTPUT

  # ----------------------------
  # Deploy to STAGING (no approval by default)
  # ----------------------------
  deploy_staging:
    name: Deploy to staging
    needs: docker
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      # Optional: show a link button in the UI
      # url: ${{ vars.STAGING_URL }}
    steps:
      - name: Deploy
        run: |
          echo "Deploying ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }} to STAGING"
          # مثال:
          # ./deploy/deploy.sh staging "${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}"

  # ----------------------------
  # Deploy to PRODUCTION (manual approval via Environment required reviewers)
  # ----------------------------
  deploy_production:
    name: Deploy to production (manual approval)
    needs: docker
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      # Optional: show a link button in the UI
      # url: ${{ vars.PROD_URL }}
    steps:
      - name: Deploy
        run: |
          echo "Deploying ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }} to PRODUCTION"
          # مثال:
          # ./deploy/deploy.sh production "${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}"
