name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write      # needed for dependency graph submission
  issues: write        # needed for gh issue create

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create issue (example)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Issue title" \
            --body "Issue body"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven (includes tests)
        run: mvn -B verify --file pom.xml

      - name: Update dependency graph
        if: github.event_name == 'push'   # avoids permission issues on fork PRs
        uses: advanced-security/maven-dependency-submission-action@v4
