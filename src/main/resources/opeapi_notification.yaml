openapi: "3.0.3"
info:
  title: Users Service API
  description: REST API for profiles, settings, and avatars for the chat application.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local Users Service
  - url: http://localhost:8083/api
    description: Through API Gateway (prefix /api)
tags:
  - name: Users
    description: User profile and settings endpoints
  - name: Media
    description: Avatar and media-related endpoints
paths:
  /notification/show-notification:
    get:
      tags: [Notifications]
      summary: Shows all the users notification
      operationId: showAllNotifications
      responses:
        '200':
          description: Shows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '500':
          $ref: '#/components/responses/BadRequest'
components:
  responses:
    BadRequest:
      description: The request payload is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Notification:
      type: object
      required: [ senderUsername, userId ]
      properties:
        userId:
          type: string
          description: >
            User identifier associated with this notification. It matches the
            userId used by the users-service and corresponds to the Keycloak
            subject (sub) for that user.
        senderUsername:
          type: string

    PresignRequest:
      type: object
      required: [contentType]
      properties:
        contentType:
          type: string
          description: MIME type of the avatar to upload
          example: image/png
        filename:
          type: string
          description: Optional client-side filename hint
          example: avatar.png
    PresignResponse:
      type: object
      required: [uploadUrl, publicUrl, method, headers, message]
      properties:
        uploadUrl:
          type: string
          format: uri
          description: URL to PUT the avatar content to
        method:
          type: string
          example: PUT
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers required by the storage provider (e.g. Content-Type)
        publicUrl:
          type: string
          format: uri
          description: Public URL the service will store as avatarUrl after upload
        message:
          type: string
          description: Cause of error
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
